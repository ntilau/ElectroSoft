name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: setup.py

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest ruff

      - name: Build native meshers (Triangle / TetGen)
        run: |
          set -euo pipefail
          python tools/build_triangle.py
          python tools/build_tetgen.py
          # Force-build verification: TetGen shared library must exist,
          # otherwise 3D mesh tests silently fail later.
          case "$RUNNER_OS" in
            macOS*) lib=build/libtetgen.dylib ;;
            Windows*) lib=build/tetgen.dll ;;
            *) lib=build/libtetgen.so ;;
          esac
          test -f "$lib" || { echo "TetGen shared library $lib was not produced"; exit 1; }

      - name: Lint
        run: ruff check fes tools tests mm n2f rfm setup.py

      - name: Unit tests
        run: python -m pytest -q
